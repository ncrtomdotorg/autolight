<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Light Clinic Submission</title>
  <style>
    /* Your custom styles for the form */
    body {
      font-family: Arial, sans-serif;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f9f9f9;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      font-weight: bold;
      margin-top: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0 15px;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    .hidden { display: none; }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px;
      border-radius: 5px;
      z-index: 1000;
    }
    .make-model-display {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <form id="autoLightForm">
    <h1>Auto Light Clinic Submission</h1>

    <!-- VIN Scanner Toggle Button -->
    <button type="button" id="enableScanner">Enable Scanner</button>

    <!-- VIN Input field -->
    <label for="vin">VIN:</label>
    <input type="text" id="vin" name="VIN" required>

    <!-- Displaying the make and model after VIN scan -->
    <div class="make-model-display" id="makeModelDisplay"></div>

    <!-- Decode VIN button -->
    <button type="button" id="decodeVIN">Decode VIN</button>

    <!-- Make and Model Dropdowns -->
    <label for="make">Make:</label>
    <select id="make" name="Make" required>
      <option value="">Select Make</option>
    </select>

    <label for="model">Model:</label>
    <select id="model" name="Model" required>
      <option value="">Select Model</option>
    </select>

    <!-- ZIP code input -->
    <label for="zip">ZIP Code:</label>
    <input type="text" id="zip" name="ZIP" required>

    <!-- Headlights input -->
    <label for="headlights">How many headlights:</label>
    <input type="number" id="headlights" name="Headlights" value="0">

    <!-- Other bulbs input -->
    <label for="otherBulbs">How many other bulbs:</label>
    <input type="number" id="otherBulbs" name="OtherBulbs" value="0">

    <!-- Polished input -->
    <label for="polished">Were the headlights polished?</label>
    <select id="polished" name="Polished">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <!-- Submit Button -->
    <button type="submit">Submit</button>

    <!-- Confirmation Popup -->
    <div class="popup hidden" id="popup">Form Submitted!</div>
  </form>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbywW77s3BXRcNeSMEVIP-Qzz9m9RMwVkNaeYvnJvuKOOnV4enmOHaQGxQnOlVZzS08ZGQ/exec';
    const form = document.getElementById('autoLightForm');
    const makeSelect = document.getElementById('make');
    const modelSelect = document.getElementById('model');
    const makeModelDisplay = document.getElementById('makeModelDisplay');
    const popup = document.getElementById('popup');
    const vinInput = document.getElementById('vin');
    const zipInput = document.getElementById('zip');
    const headlightsInput = document.getElementById('headlights');
    const otherBulbsInput = document.getElementById('otherBulbs');
    const polishedInput = document.getElementById('polished');
    const enableScannerBtn = document.getElementById('enableScanner');
    const decodeVINBtn = document.getElementById('decodeVIN');

    // Fetch Makes and Models from Google Apps Script
    fetch('https://script.google.com/macros/s/AKfycbyADfBBBkqBz9lNiWMaIpPbH8CJbDC9SiXG85mP1u_R9C9kqw5Fb81tiJvghwGMi6qW/exec?action=getMakesAndModels')
      .then(response => response.json())
      .then(data => {
        // Populate the Make dropdown
        for (const make in data) {
          const option = document.createElement('option');
          option.value = make;
          option.textContent = make;
          makeSelect.appendChild(option);
        }

        makeSelect.addEventListener('change', function() {
          modelSelect.innerHTML = '<option value="">Select Model</option>';
          const selectedMake = makeSelect.value;
          const models = data[selectedMake] || [];
          models.forEach(model => {
            const option = document.createElement('option');
            option.value = model;
            option.textContent = model;
            modelSelect.appendChild(option);
          });
        });
      })
      .catch(error => console.error('Error loading makes and models:', error));

    // Handle form submission
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      formData.append('Date', new Date().toISOString());

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => {
          popup.classList.remove('hidden');
          setTimeout(() => {
            popup.classList.add('hidden');
            form.reset();
            modelSelect.innerHTML = '<option value="">Select Model</option>';
            makeModelDisplay.innerHTML = '';  // Clear the displayed make and model
          }, 2000);
        })
        .catch(error => console.error('Error!', error.message));
    });

    // Enable/Disable Scanner
    let scannerEnabled = false;
    enableScannerBtn.addEventListener('click', function() {
      scannerEnabled = !scannerEnabled;
      if (scannerEnabled) {
        enableScannerBtn.textContent = 'Disable Scanner';
        // Simulate scanning a VIN
        vinInput.value = '1HGCM82633A123456';  // Simulate scanning a VIN
        searchVIN(vinInput.value);  // Automatically decode the VIN after scanning
      } else {
        enableScannerBtn.textContent = 'Enable Scanner';
        vinInput.value = '';
        makeModelDisplay.innerHTML = '';  // Clear the displayed make and model
      }
    });

    // VIN Decode function to fetch make/model from the scanned VIN
    decodeVINBtn.addEventListener('click', function() {
      const vin = vinInput.value;
      searchVIN(vin);
    });

    // Function to handle VIN search and display the make/model
    function searchVIN(vin) {
      fetch(`https://some-vin-decoder-api.com/lookup?vin=${vin}`)
        .then(response => response.json())
        .then(data => {
          const make = data.make || 'Unknown';
          const model = data.model || 'Unknown';
          makeModelDisplay.innerHTML = `Make: ${make} | Model: ${model}`;

          // Populate the select options based on the retrieved data
          makeSelect.value = make;
          modelSelect.value = model;
        })
        .catch(error => console.error('Error fetching VIN data:', error));
    }
  </script>
</body>
</html>
