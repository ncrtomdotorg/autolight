<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Light Clinic Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f9;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    form {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 15px;
      background-color: #007BFF;
      color: white;
      border: none;
    }
    button:disabled {
      background-color: #ccc;
    }
    #loader {
      text-align: center;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

<h1>Auto Light Clinic Submission</h1>

<form id="lightForm">
  <label for="vin">VIN</label>
  <input type="text" id="vin" name="VIN" placeholder="Scan or enter VIN manually" required>

  <button type="button" id="enableScanner">Enable Scanner</button>
  <button type="button" id="manualSearch">Search</button>

  <label for="make">Make</label>
  <select id="make" name="Make" required>
    <option value="">Select Make</option>
  </select>

  <label for="model">Model</label>
  <select id="model" name="Model" required>
    <option value="">Select Model</option>
  </select>

  <label for="zip">ZIP Code</label>
  <input type="text" id="zip" name="ZIP" required>

  <label for="headlights">How many headlights?</label>
  <input type="number" id="headlights" name="Headlights" min="0" value="0">

  <label for="otherBulbs">How many other bulbs?</label>
  <input type="number" id="otherBulbs" name="OtherBulbs" min="0" value="0">

  <label for="polished">Were the headlights polished?</label>
  <select id="polished" name="Polished">
    <option value="No" selected>No</option>
    <option value="Yes">Yes</option>
  </select>

  <div id="loader">Loading...</div>

  <button type="submit" id="submitButton">Submit</button>
</form>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script>
  const form = document.getElementById('lightForm');
  const loader = document.getElementById('loader');
  const submitButton = document.getElementById('submitButton');
  const makeSelect = document.getElementById('make');
  const modelSelect = document.getElementById('model');
  const vinInput = document.getElementById('vin');

  let scanner;
  let makesAndModels = {};
  const sheetURL = 'https://script.google.com/macros/s/AKfycbxYfKIiE_-dEWin6M_W3y30dr4R42w833qndEeHqsBf9nfEgKs6gVmcJju3DUvZdvLi/exec';

  async function fetchMakesAndModels() {
    try {
      const response = await fetch(sheetURL + '?action=getMakesAndModels');
      const data = await response.json();
      makesAndModels = data;
      populateMakes();
    } catch (error) {
      alert('Error fetching makes and models.');
    }
  }

  function populateMakes() {
    makeSelect.innerHTML = '<option value="">Select Make</option>';
    Object.keys(makesAndModels).sort().forEach(make => {
      const option = document.createElement('option');
      option.value = make;
      option.text = make;
      makeSelect.add(option);
    });
  }

  function populateModels(selectedMake) {
    modelSelect.innerHTML = '<option value="">Select Model</option>';
    if (makesAndModels[selectedMake]) {
      makesAndModels[selectedMake].sort().forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.text = model;
        modelSelect.add(option);
      });
    }
  }

  makeSelect.addEventListener('change', () => {
    populateModels(makeSelect.value);
  });

  async function decodeVIN(vin) {
    if (!vin) return;
    loader.style.display = 'block';
    try {
      const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/${vin}?format=json`);
      const data = await response.json();
      const result = data.Results[0];
      makeSelect.value = result.Make || '';
      populateModels(result.Make);
      modelSelect.value = result.Model || '';
    } catch (error) {
      console.error(error);
      alert('Failed to decode VIN.');
    } finally {
      loader.style.display = 'none';
    }
  }

  document.getElementById('manualSearch').addEventListener('click', () => {
    const vin = vinInput.value.trim();
    if (vin) {
      decodeVIN(vin);
    }
  });

  document.getElementById('enableScanner').addEventListener('click', () => {
    if (scanner) {
      scanner.stop();
      scanner = null;
      return;
    }
    const html5QrCode = new Html5Qrcode("reader");
    scanner = html5QrCode;
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        vinInput.value = decodedText;
        decodeVIN(decodedText);
        html5QrCode.stop();
        scanner = null;
      },
      (errorMessage) => { /* ignore scan errors */ }
    ).catch(err => {
      console.error(err);
      alert('Camera access denied or not supported.');
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitButton.disabled = true;
    loader.style.display = 'block';

    const formData = new FormData(form);
    const params = new URLSearchParams(formData).toString();

    try {
      const response = await fetch(sheetURL, {
        method: 'POST',
        body: params,
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
      });
      const text = await response.text();
      if (text === 'Success') {
        alert('Thank you! Your entry has been recorded.');
        form.reset();
        modelSelect.innerHTML = '<option value="">Select Model</option>';
      } else {
        alert('There was an error. Please try again.');
      }
    } catch (error) {
      console.error(error);
      alert('Submission failed.');
    } finally {
      loader.style.display = 'none';
      submitButton.disabled = false;
    }
  });

  // Initialize
  fetchMakesAndModels();
</script>

<!-- Camera placeholder -->
<div id="reader" style="width: 300px; margin: 20px auto;"></div>

</body>
</html>
