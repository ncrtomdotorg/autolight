<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Automotive Selector Form</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.7/minified/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f9f9f9; }
    form { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
    label { display: block; margin-top: 15px; }
    input, select, button { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
    button { background: #007BFF; color: white; border: none; cursor: pointer; margin-top: 20px; }
    button:hover { background: #0056b3; }
    #qr-reader { width: 100%; margin-top: 15px; display: none; }
  </style>
</head>
<body>

<form id="autoForm">
  <h2>Automotive Selector Form</h2>

  <label for="date">Date:</label>
  <input type="date" id="date" name="date" required>

  <label for="vin">VIN Number:</label>
  <input type="text" id="vin" name="vin" placeholder="Scan or enter VIN" required>

  <label for="make">Make:</label>
  <input type="text" id="make" name="make" placeholder="Auto-filled from VIN" required>

  <label for="model">Model:</label>
  <input type="text" id="model" name="model" placeholder="Auto-filled from VIN" required>

  <label for="zip">ZIP Code:</label>
  <input type="text" id="zip" name="zip" placeholder="Enter ZIP Code" required>

  <button type="button" onclick="startScanner()">Enable VIN Scanner</button>
  <div id="qr-reader"></div>

  <button type="submit">Submit</button>
</form>

<script>
  const form = document.getElementById('autoForm');
  const vinField = document.getElementById('vin');
  const makeField = document.getElementById('make');
  const modelField = document.getElementById('model');
  const dateField = document.getElementById('date');

  // ✅ Auto-fill date on load
  function setTodayDate() {
    const today = new Date().toISOString().substr(0, 10);
    dateField.value = today;
  }
  setTodayDate();

  // VIN Decoder
  async function decodeVIN(vin) {
    if (!vin || vin.length < 8) return;

    try {
      const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/${vin}?format=json`);
      const data = await response.json();
      const results = data.Results;

      const make = results.find(r => r.Variable === "Make")?.Value || '';
      const model = results.find(r => r.Variable === "Model")?.Value || '';

      makeField.value = make;
      modelField.value = model;

    } catch (error) {
      console.error('VIN decoding error:', error);
    }
  }

  // Auto decode VIN when field changes
let vinTimeout;
function handleVinInput() {
  clearTimeout(vinTimeout);
  vinTimeout = setTimeout(() => {
    const vin = vinField.value.trim();
    if (vin.length >= 8) {
      decodeVIN(vin);
    }
  }, 500); // debounce to avoid API spam
}

vinField.addEventListener('input', handleVinInput);
vinField.addEventListener('blur', handleVinInput);

  // Scanner function
  function startScanner() {
    const scanner = new Html5Qrcode("qr-reader");
    document.getElementById('qr-reader').style.display = 'block';

    scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        scanner.stop();
        document.getElementById('qr-reader').style.display = 'none';

        vinField.value = decodedText.trim();
        decodeVIN(decodedText.trim()); // ✅ Auto-trigger decode after scan
      },
      (error) => {
        console.warn('QR error:', error);
      }
    );
  }

  // Submit handler
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    const payload = new URLSearchParams(formData);

    try {
      await fetch('https://script.google.com/macros/s/AKfycbyADfBBBkqBz9lNiWMaIpPbH8CJbDC9SiXG85mP1u_R9C9kqw5Fb81tiJvghwGMi6qW/exec', {
        method: 'POST',
        body: payload,
      });
      alert('Thank you! Your entry has been recorded.');

      form.reset();
      setTodayDate(); // ✅ Reset date after submission
    } catch (error) {
      alert('Error submitting form. Please try again.');
      console.error('Submit error:', error);
    }
  });
</script>

</body>
</html>
