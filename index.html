<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Light Clinic Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 20px;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 0 auto;
    }
    label {
      display: block;
      margin-top: 15px;
      color: #555;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 15px;
    }
    button:disabled {
      background-color: #cccccc;
    }
    #scanner {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <h1>Auto Light Clinic Submission</h1>
  <form id="autoLightForm">
    <label for="vin">VIN</label>
    <input type="text" id="vin" name="VIN" placeholder="Scan or enter VIN manually" required>

    <button type="button" id="enableScanner">Enable Scanner</button>

    <!-- Scanner container moved below Enable Scanner button -->
    <div id="scanner"></div>

    <button type="button" id="searchVin">Search VIN</button>

    <label for="make">Make</label>
    <select id="make" name="Make" required>
      <option value="">Select Make</option>
    </select>

    <label for="model">Model</label>
    <select id="model" name="Model" required>
      <option value="">Select Model</option>
    </select>

    <label for="zip">ZIP Code</label>
    <input type="text" id="zip" name="ZIP" placeholder="Enter ZIP Code" required>

    <label for="headlights">How many headlights?</label>
    <input type="number" id="headlights" name="Headlights" placeholder="0" min="0">

    <label for="otherBulbs">How many other bulbs?</label>
    <input type="number" id="otherBulbs" name="OtherBulbs" placeholder="0" min="0">

    <label for="polished">Were the headlights polished?</label>
    <select id="polished" name="Polished">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <button type="submit">Submit</button>
  </form>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script>
    const form = document.getElementById('autoLightForm');
    const makeSelect = document.getElementById('make');
    const modelSelect = document.getElementById('model');
    const vinInput = document.getElementById('vin');
    const enableScannerBtn = document.getElementById('enableScanner');
    const searchVinBtn = document.getElementById('searchVin');
    let scanner;

    const scriptURL = 'https://script.google.com/macros/s/AKfycbyADfBBBkqBz9lNiWMaIpPbH8CJbDC9SiXG85mP1u_R9C9kqw5Fb81tiJvghwGMi6qW/exec';

    async function fetchMakesAndModels() {
      try {
        const response = await fetch(scriptURL + '?action=getMakesAndModels');
        const data = await response.json();

        makeSelect.innerHTML = '<option value="">Select Make</option>';
        Object.keys(data).forEach(make => {
          const option = document.createElement('option');
          option.value = make;
          option.textContent = make;
          makeSelect.appendChild(option);
        });

        makeSelect.addEventListener('change', () => {
          const selectedMake = makeSelect.value;
          modelSelect.innerHTML = '<option value="">Select Model</option>';
          if (data[selectedMake]) {
            data[selectedMake].forEach(model => {
              const option = document.createElement('option');
              option.value = model;
              option.textContent = model;
              modelSelect.appendChild(option);
            });
          }
        });
      } catch (error) {
        console.error('Error loading makes and models:', error);
      }
    }

    fetchMakesAndModels();

    async function fetchVehicleData(vin) {
      try {
        searchVinBtn.disabled = true;
        searchVinBtn.textContent = 'Searching...';
        const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvalues/${vin}?format=json`);
        const data = await response.json();
        const result = data.Results[0];
        makeSelect.value = result.Make || '';
        makeSelect.dispatchEvent(new Event('change'));
        setTimeout(() => {
          modelSelect.value = result.Model || '';
        }, 300);
      } catch (error) {
        console.error('Error fetching vehicle data:', error);
      } finally {
        searchVinBtn.disabled = false;
        searchVinBtn.textContent = 'Search VIN';
      }
    }

    searchVinBtn.addEventListener('click', () => {
      const vin = vinInput.value.trim();
      if (vin) {
        fetchVehicleData(vin);
      }
    });

    enableScannerBtn.addEventListener('click', () => {
      if (scanner) {
        scanner.stop().then(() => scanner.clear());
        scanner = null;
        enableScannerBtn.textContent = 'Enable Scanner';
        return;
      }

      scanner = new Html5Qrcode("scanner");

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250, supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_CAMERA] },
        (decodedText, decodedResult) => {
          if (decodedResult.result.format.formatName !== 'QR_CODE') {
            vinInput.value = decodedText;
            fetchVehicleData(decodedText);
            scanner.stop().then(() => {
              scanner.clear();
              scanner = null;
              enableScannerBtn.textContent = 'Enable Scanner';
            });
          }
        },
        (errorMessage) => {
          // console.warn(`Scanner error: ${errorMessage}`);
        }
      ).then(() => {
        enableScannerBtn.textContent = 'Disable Scanner';
      }).catch(err => {
        console.error('Unable to start scanner:', err);
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const pair of formData.entries()) {
        params.append(pair[0], pair[1]);
      }

      try {
        await fetch(scriptURL, { method: 'POST', body: params });
        alert('Thank you! Your entry has been recorded.');
        form.reset();
        makeSelect.innerHTML = '<option value="">Select Make</option>';
        modelSelect.innerHTML = '<option value="">Select Model</option>';
        fetchMakesAndModels();
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('There was an error submitting the form. Please try again.');
      }
    });
  </script>
</body>
</html>
