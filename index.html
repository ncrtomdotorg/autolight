<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Light Clinic Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f4f4f9;
    }
    h2 {
      text-align: center;
    }
    form {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .loading {
      text-align: center;
      margin-top: 10px;
    }
    #scanner {
      width: 100%;
      margin-top: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Auto Light Clinic Submission</h2>
  <form id="autoForm">
    <label for="vin">VIN:</label>
    <input type="text" id="vin" name="vin" placeholder="Scan or enter VIN manually" />

    <button type="button" onclick="decodeVIN()">Search VIN</button>
    <button type="button" onclick="enableScanner()">Enable Scanner</button>

    <div id="scanner" class="hidden"></div>

    <label for="make">Make:</label>
    <select id="make" name="make">
      <option value="">Select Make</option>
    </select>

    <label for="model">Model:</label>
    <select id="model" name="model">
      <option value="">Select Model</option>
    </select>

    <label for="manualModel">Manual Model Entry (Optional):</label>
    <input type="text" id="manualModel" name="manualModel" placeholder="Enter model manually if not listed" />

    <label for="zip">ZIP Code:</label>
    <input type="text" id="zip" name="zip" required />

    <label for="headlights">How many headlights?</label>
    <input type="number" id="headlights" name="headlights" min="0" value="0" />

    <label for="otherBulbs">How many other bulbs?</label>
    <input type="number" id="otherBulbs" name="otherBulbs" min="0" value="0" />

    <label for="polished">Were the headlights polished?</label>
    <select id="polished" name="polished">
      <option value="No">No</option>
      <option value="Yes">Yes</option>
    </select>

    <div class="loading" id="loadingMessage" style="display: none;">Loading...</div>

    <button type="submit">Submit</button>
  </form>

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script>
    const form = document.getElementById('autoForm');
    const vinInput = document.getElementById('vin');
    const makeSelect = document.getElementById('make');
    const modelSelect = document.getElementById('model');
    const manualModel = document.getElementById('manualModel');
    const loadingMessage = document.getElementById('loadingMessage');
    const scannerContainer = document.getElementById('scanner');

    let scanner;
    let scanning = false;

    async function fetchMakeModel() {
      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbyADfBBBkqBz9lNiWMaIpPbH8CJbDC9SiXG85mP1u_R9C9kqw5Fb81tiJvghwGMi6qW/exec');
        const data = await response.json();

        makeSelect.innerHTML = '<option value="">Select Make</option>';
        data.make.forEach(make => {
          const option = document.createElement('option');
          option.value = make;
          option.textContent = make;
          makeSelect.appendChild(option);
        });

        modelSelect.innerHTML = '<option value="">Select Model</option>';
        data.model.forEach(model => {
          const option = document.createElement('option');
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
      } catch (error) {
        console.error('Error fetching make and model:', error);
      }
    }

    async function decodeVIN() {
      const vin = vinInput.value.trim();
      if (!vin) {
        alert('Please enter a VIN.');
        return;
      }

      loadingMessage.style.display = 'block';
      try {
        const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/${vin}?format=json`);
        const data = await response.json();
        const results = data.Results;

        const make = results.find(item => item.Variable === 'Make')?.Value || '';
        const model = results.find(item => item.Variable === 'Model')?.Value || '';

        if (make) makeSelect.value = make;
        if (model) modelSelect.value = model;

      } catch (error) {
        console.error('Error decoding VIN:', error);
      } finally {
        loadingMessage.style.display = 'none';
      }
    }

    function enableScanner() {
      if (scanning) return;

      scanning = true;
      scannerContainer.classList.remove('hidden');

      scanner = new ZXing.BrowserBarcodeReader();
      scanner.decodeFromVideoDevice(undefined, scannerContainer, (result, err) => {
        if (result) {
          vinInput.value = result.text;
          decodeVIN();
          disableScanner();
        }
      });
    }

    function disableScanner() {
      if (scanner) {
        scanner.reset();
        scannerContainer.classList.add('hidden');
        scanning = false;
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      loadingMessage.style.display = 'block';

      const formData = new FormData(form);
      const manualModelValue = manualModel.value.trim();
      const selectedModel = manualModelValue || formData.get('model');

      const payload = {
        date: new Date().toLocaleString(),
        vin: formData.get('vin'),
        make: formData.get('make'),
        model: selectedModel,
        zip: formData.get('zip'),
        headlights: formData.get('headlights') || '0',
        otherBulbs: formData.get('otherBulbs') || '0',
        polished: formData.get('polished') || 'No'
      };

      try {
        await fetch('https://script.google.com/macros/s/AKfycbywW77s3BXRcNeSMEVIP-Qzz9m9RMwVkNaeYvnJvuKOOnV4enmOHaQGxQnOlVZzS08ZGQ/exec', {
          method: 'POST',
          body: JSON.stringify(payload),
          headers: { 'Content-Type': 'application/json' }
        });
        alert('Thank you! Your entry has been recorded.');
        form.reset();
        disableScanner();
      } catch (error) {
        console.error('Error submitting form:', error);
        alert('There was an error submitting the form.');
      } finally {
        loadingMessage.style.display = 'none';
      }
    });

    // Initial load
    fetchMakeModel();
  </script>
</body>
</html>
