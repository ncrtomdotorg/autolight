<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Light Clinic Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
      color: #333;
    }
    h2 {
      text-align: center;
    }
    form {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    #scanner {
      width: 100%;
      margin-top: 15px;
      display: none;
    }
    .toggle-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      margin-top: 10px;
    }
    .search-btn {
      background-color: #2196F3;
      color: white;
      border: none;
      margin-top: 10px;
    }
    .success {
      color: green;
      text-align: center;
    }
    .error {
      color: red;
      text-align: center;
    }
  </style>
</head>
<body>

<h2>Auto Light Clinic Submission</h2>
<form id="autoForm">
  <label for="date">Date:</label>
  <input type="date" id="date" name="date" required>

  <label for="vin">VIN:</label>
  <input type="text" id="vin" name="vin" placeholder="Scan or enter VIN" required>
  <button type="button" class="search-btn" onclick="manualVinSearch()">Search VIN</button>

  <button type="button" class="toggle-button" onclick="toggleScanner()">Enable/Disable Scanner</button>
  <div id="scanner"></div>

  <label for="make">Make:</label>
  <select id="make" name="make" required>
    <option value="">Select Make</option>
  </select>

  <label for="model">Model:</label>
  <select id="model" name="model" required>
    <option value="">Select Model</option>
  </select>

  <label for="zip">ZIP Code:</label>
  <input type="text" id="zip" name="zip" placeholder="Enter ZIP code" required>

  <label for="headlights">How many headlights?</label>
  <input type="number" id="headlights" name="headlights" value="0" min="0" required>

  <label for="otherBulbs">How many other bulbs?</label>
  <input type="number" id="otherBulbs" name="otherBulbs" value="0" min="0" required>

  <label for="polished">Were the headlights polished?</label>
  <select id="polished" name="polished">
    <option value="No">No</option>
    <option value="Yes">Yes</option>
  </select>

  <button type="submit">Submit</button>
  <div id="message"></div>
</form>

<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbywW77s3BXRcNeSMEVIP-Qzz9m9RMwVkNaeYvnJvuKOOnV4enmOHaQGxQnOlVZzS08ZGQ/exec';
  const form = document.getElementById('autoForm');
  const scannerContainer = document.getElementById('scanner');
  const vinInput = document.getElementById('vin');
  let scannerActive = false;
  let makesAndModels = {};  // This will store all makes and models

  // Set today's date by default
  document.getElementById('date').valueAsDate = new Date();

  // Fetch makes and models from Google Apps Script
  async function fetchMakesAndModels() {
    try {
      const response = await fetch('https://script.google.com/macros/s/AKfycbxpbSvY3i8pbsKb_P2mWa9y6S5e8y6EiZhNJSXwNr4ZmYl_bh8CEuFZc5DJUlupGaku/exec');
      const data = await response.json();
      makesAndModels = data;  // Save the data to use later

      // Populate Make select dropdown
      const makeSelect = document.getElementById('make');
      for (const make in makesAndModels) {
        const option = document.createElement('option');
        option.value = make;
        option.textContent = make;
        makeSelect.appendChild(option);
      }

    } catch (error) {
      console.error('Error fetching makes and models:', error);
    }
  }

  // Auto populate Models based on selected Make
  document.getElementById('make').addEventListener('change', function() {
    const modelSelect = document.getElementById('model');
    modelSelect.innerHTML = '<option value="">Select Model</option>';

    const selectedMake = this.value;
    if (selectedMake && makesAndModels[selectedMake]) {
      makesAndModels[selectedMake].forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelSelect.appendChild(option);
      });
    }
  });

  // Manual VIN search
  async function manualVinSearch() {
    const vin = vinInput.value.trim();
    if (!vin) return alert('Please enter a VIN first.');
    try {
      const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/${vin}?format=json`);
      const data = await response.json();
      const make = data.Results.find(item => item.Variable === 'Make')?.Value;
      const model = data.Results.find(item => item.Variable === 'Model')?.Value;

      if (make && model) {
        document.getElementById('make').value = make;
        document.getElementById('make').dispatchEvent(new Event('change'));
        setTimeout(() => {
          document.getElementById('model').value = model;
        }, 100); // Wait for models to populate
      } else {
        alert('Could not decode VIN. Please check the VIN and try again.');
      }
    } catch (error) {
      console.error(error);
      alert('Error decoding VIN.');
    }
  }

  // Start or stop scanner
  async function startScanner() {
    html5QrCode = new Html5Qrcode("scanner");
    const config = { fps: 10, qrbox: 250, formatsToSupport: [Html5QrcodeSupportedFormats.CODE_39] };
    try {
      await html5QrCode.start({ facingMode: "environment" }, config, async (decodedText) => {
        vinInput.value = decodedText;
        manualVinSearch();
        stopScanner();
      });
    } catch (err) {
      console.error('Error starting scanner:', err);
      alert('Error starting scanner: ' + err.message);
    }
  }

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        scannerContainer.style.display = 'none';
        scannerActive = false;
      }).catch(err => console.error('Stop scanner error', err));
    }
  }

  function toggleScanner() {
    if (scannerActive) {
      stopScanner();
    } else {
      scannerContainer.style.display = 'block';
      startScanner();
      scannerActive = true;
    }
  }

  // Handle form submission
  form.addEventListener('submit', e => {
    e.preventDefault();
    const formData = new FormData(form);
    fetch(scriptURL, { method: 'POST', body: formData })
      .then(() => {
        document.getElementById('message').innerHTML = '<p class="success">Thank you! Your entry has been recorded.</p>';
        form.reset();
        document.getElementById('date').valueAsDate = new Date();
      })
      .catch(error => {
        console.error('Error!', error.message);
        document.getElementById('message').innerHTML = '<p class="error">Error! Please try again.</p>';
      });
  });

  // Load makes and models when page loads
  fetchMakesAndModels();

</script>

</body>
</html>
