<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auto Light Clinic Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    h2 {
      text-align: center;
      color: #444;
    }
    form {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    label {
      margin-top: 12px;
      display: block;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #loading {
      text-align: center;
      color: #007BFF;
      margin-top: 10px;
    }
    .scanner-toggle {
      margin-top: 16px;
      text-align: center;
    }
    video {
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>Auto Light Clinic Submission</h2>
  <form id="autoLightForm">
    <label for="vin">VIN:</label>
    <input type="text" id="vin" name="vin" placeholder="Scan or enter VIN" required>

    <label for="make">Make:</label>
    <input type="text" id="make" name="make" placeholder="Auto-filled or enter manually" required>

    <label for="model">Model:</label>
    <input type="text" id="model" name="model" placeholder="Auto-filled or enter manually" required>

    <label for="zip">ZIP Code:</label>
    <input type="text" id="zip" name="zip" required>

    <label for="headlights">How many headlights?</label>
    <input type="number" id="headlights" name="headlights" min="0" value="0">

    <label for="bulbs">How many other bulbs?</label>
    <input type="number" id="bulbs" name="bulbs" min="0" value="0">

    <label for="polished">Were the headlights polished?</label>
    <select id="polished" name="polished">
      <option value="No" selected>No</option>
      <option value="Yes">Yes</option>
    </select>

    <button type="submit">Submit</button>
    <div id="loading"></div>
  </form>

  <div class="scanner-toggle">
    <button id="toggleScanner">Enable VIN Scanner</button>
    <video id="preview" hidden></video>
  </div>

  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script>
    const form = document.getElementById('autoLightForm');
    const vinInput = document.getElementById('vin');
    const makeInput = document.getElementById('make');
    const modelInput = document.getElementById('model');
    const loading = document.getElementById('loading');
    const toggleScannerButton = document.getElementById('toggleScanner');
    const video = document.getElementById('preview');

    let scannerEnabled = false;
    let codeReader;

    async function fetchVehicleData(vin) {
      loading.textContent = 'Decoding VIN...';
      try {
        const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/decodevinvaluesextended/${vin}?format=json`);
        const data = await response.json();
        const result = data.Results[0];
        makeInput.value = result.Make || '';
        modelInput.value = result.Model || '';
      } catch (error) {
        console.error('Error fetching VIN data:', error);
      } finally {
        loading.textContent = '';
      }
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      loading.textContent = 'Submitting...';

      const formData = new FormData(form);

      // Ensure optional fields have default values
      if (!formData.get('headlights')) formData.set('headlights', '0');
      if (!formData.get('bulbs')) formData.set('bulbs', '0');
      if (!formData.get('polished')) formData.set('polished', 'No');

      try {
        await fetch('https://script.google.com/macros/s/AKfycbywW77s3BXRcNeSMEVIP-Qzz9m9RMwVkNaeYvnJvuKOOnV4enmOHaQGxQnOlVZzS08ZGQ/exec', {
          method: 'POST',
          body: formData
        });

        loading.textContent = 'Thank you! Your entry has been recorded.';
        form.reset();
        // Reset defaults
        document.getElementById('headlights').value = 0;
        document.getElementById('bulbs').value = 0;
        document.getElementById('polished').value = 'No';
      } catch (error) {
        console.error('Error!', error.message);
        loading.textContent = 'Submission failed. Please try again.';
      } finally {
        setTimeout(() => loading.textContent = '', 2000);
      }
    });

    toggleScannerButton.addEventListener('click', async () => {
      if (!scannerEnabled) {
        codeReader = new ZXing.BrowserBarcodeReader();
        try {
          const videoInputDevices = await codeReader.listVideoInputDevices();
          if (videoInputDevices.length > 0) {
            scannerEnabled = true;
            toggleScannerButton.textContent = 'Disable VIN Scanner';
            video.hidden = false;

            codeReader.decodeFromVideoDevice(videoInputDevices[0].deviceId, 'preview', (result, err) => {
              if (result) {
                vinInput.value = result.text;
                fetchVehicleData(result.text);
                stopScanner();
              }
              if (err && !(err instanceof ZXing.NotFoundException)) {
                console.error(err);
              }
            });
          } else {
            alert('No video input devices found');
          }
        } catch (err) {
          console.error(err);
          alert('Error accessing camera');
        }
      } else {
        stopScanner();
      }
    });

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
        video.hidden = true;
        scannerEnabled = false;
        toggleScannerButton.textContent = 'Enable VIN Scanner';
      }
    }
  </script>
</body>
</html>
