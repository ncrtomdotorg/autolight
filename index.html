<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Light Clinic Submission</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Quagga/0.12.1/quagga.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
        }
        form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        input, button {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        input[type="checkbox"] {
            width: auto;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
        }
        button:disabled {
            background-color: #ccc;
        }
        #scanner {
            display: none;
            width: 100%;
            height: 300px;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #000;
        }
        #confirmation {
            text-align: center;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<form id="autoLightForm">
    <h2>Auto Light Clinic Submission</h2>
    <label for="vin">Scan VIN (or enter manually):</label>
    <input type="text" id="vin" name="vin" placeholder="Enter VIN">
    <button type="button" id="enableScannerBtn" onclick="enableScanner()">Enable Scanner</button>
    <div id="scanner"></div>
    <br>
    <label for="zipCode">ZIP Code:</label>
    <input type="text" id="zipCode" name="zipCode" placeholder="Enter ZIP Code" required>
    
    <label for="headlights">Headlights (0-5):</label>
    <input type="number" id="headlights" name="headlights" min="0" max="5" value="0" required>
    
    <label for="otherBulbs">Other Bulbs (0-5):</label>
    <input type="number" id="otherBulbs" name="otherBulbs" min="0" max="5" value="0" required>
    
    <label for="headlightsPolished">Headlights Polished:</label>
    <input type="checkbox" id="headlightsPolished" name="headlightsPolished">

    <br>
    <button type="submit">Submit</button>
    
    <div id="confirmation" style="display:none;">Thank you! Your entry has been recorded.</div>
</form>

<script>
    let scannerEnabled = false;
    let form = document.getElementById('autoLightForm');
    let enableScannerBtn = document.getElementById('enableScannerBtn');
    let scannerElement = document.getElementById('scanner');
    let confirmationDiv = document.getElementById('confirmation');
    let vinInput = document.getElementById('vin');
    
    // Function to enable barcode scanner
    function enableScanner() {
        if (scannerEnabled) return;

        scannerEnabled = true;
        enableScannerBtn.disabled = true;

        Quagga.init({
            inputStream: {
                name: "Live",
                type: "LiveStream",
                target: scannerElement
            },
            decoder: {
                readers: ["code_128_reader", "ean_reader", "ean_13_reader"]
            }
        }, function(err) {
            if (err) {
                console.log(err);
                return;
            }
            Quagga.start();
        });

        Quagga.onDetected(function(result) {
            vinInput.value = result.codeResult.code;
            fetchMakeAndModel(vinInput.value);
            disableScanner();
        });
    }

    // Disable scanner after VIN scan
    function disableScanner() {
        Quagga.stop();
        scannerElement.style.display = 'none';
    }

    // Function to fetch Make and Model from VIN
    async function fetchMakeAndModel(vin) {
        const response = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/${vin}?format=json`);
        const data = await response.json();
        
        const make = data.Results[0].Make;
        const model = data.Results[0].Model;

        // Assuming make and model are returned
        if (make && model) {
            document.getElementById('make').value = make;
            document.getElementById('model').value = model;
        }
    }

    // Handle form submission
    form.addEventListener('submit', async function(event) {
        event.preventDefault();

        // Add the current date to the submission data
        let date = new Date().toISOString();

        let formData = new FormData(form);
        formData.append('date', date);

        let response = await fetch('https://script.google.com/macros/s/AKfycbywW77s3BXRcNeSMEVIP-Qzz9m9RMwVkNaeYvnJvuKOOnV4enmOHaQGxQnOlVZzS08ZGQ/exec', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            confirmationDiv.style.display = 'block';
            setTimeout(() => {
                confirmationDiv.style.display = 'none';
                form.reset();
            }, 2000);
        }
    });
</script>

</body>
</html>
